name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: firmatech
          POSTGRES_PASSWORD: firmatech
          POSTGRES_DB: firmatech
        ports: ['5433:5432']
        options: >-
          --health-cmd "pg_isready -U firmatech" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgres://firmatech:firmatech@127.0.0.1:5433/firmatech
      PAYLOAD_SECRET: ci-secret-0123456789abcdef0123456789abcdef
      NEXT_PUBLIC_SERVER_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:unit
      - run: pnpm test:int
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: web
          push: false
          tags: firmatech-web:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

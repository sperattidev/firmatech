# Solo desarrollo: Postgres local en 127.0.0.1:5433.
#   docker compose -f deploy/docker-compose.dev.yml up -d
name: firmatech-dev

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: firmatech
      POSTGRES_PASSWORD: firmatech
      POSTGRES_DB: firmatech
    ports:
      - '127.0.0.1:5433:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U firmatech -d firmatech']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
